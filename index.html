<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MLB Lab · Vision with Data</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚾</text></svg>"><meta name="theme-color" content="#0b1020">
<meta name="description" content="MLB Lab: proprietary Home Run Score and Strikeout King of the Day. Vision with Data. A Sports Labs product.">
<style>
:root{--bg:#0b1020;--p:#131a2e;--p2:#1a2340;--b:#26304f;--t:#e6ebff;--m:#8d97b8;--a:#4fc3ff;--g:#3ddc97;--r:#ff6b7a;--y:#ffc857;--v:#b28dff;--o:#ff9f43}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--a);text-decoration:none;cursor:pointer}header{position:sticky;top:0;z-index:5;background:rgba(11,16,32,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--b)}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px}.logo{font-weight:800;font-size:18px;letter-spacing:.3px}.logo span{color:var(--o)}.tag{font-size:12px;color:var(--m);font-style:italic}
.brand{font-size:11px;font-weight:700;color:var(--m);border:1px solid var(--b);border-radius:6px;padding:2px 7px;letter-spacing:.04em}
.badge{margin-left:auto;font-size:12px;color:var(--m);background:var(--p);border:1px solid var(--b);padding:4px 10px;border-radius:99px;white-space:nowrap}
aside{position:fixed;top:53px;left:0;bottom:0;width:220px;overflow-y:auto;background:#0d1326;border-right:1px solid var(--b);padding:10px 8px;z-index:4}
nav a{display:block;color:var(--m);padding:8px 12px;border-radius:8px;font-weight:600}nav a.on,nav a:hover{background:var(--p2);color:var(--t)}nav .sec{font-size:11px;color:#5d678a;text-transform:uppercase;letter-spacing:.08em;padding:12px 12px 4px}
.mb{display:none;background:none;border:0;color:var(--t);font-size:22px;cursor:pointer}#scrim{display:none}
main{margin-left:220px;max-width:1240px;padding:16px}
@media(max-width:860px){aside{transform:translateX(-100%);transition:transform .2s}body.navopen aside{transform:none}.mb{display:block}main{margin-left:0}body.navopen #scrim{display:block;position:fixed;inset:0;background:#0008;z-index:3}}
h2{margin:6px 0 12px;font-size:20px}h3{margin:0 0 10px;font-size:15px}
.card{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}.g2{display:grid;gap:14px;grid-template-columns:1fr 1fr}@media(max-width:900px){.g2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 8px;border-bottom:1px solid var(--b);text-align:right;white-space:nowrap}
th{color:var(--m);font-weight:600;position:sticky;top:0;background:var(--p);cursor:pointer;user-select:none}td:first-child,th:first-child,.l{text-align:left}
.tw{overflow-x:auto;max-height:75vh}tr:hover td{background:var(--p2)}
.m{color:var(--m)}.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}.small{font-size:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--p2);border:1px solid var(--b);margin:1px 2px}
.pill.est{background:#2a2205;border-color:#6b5512;color:var(--y)}.pill.ok{background:#0c2b20;border-color:#1d6b4c;color:var(--g)}
.note{background:#10203a;border:1px solid #1f3f6a;border-radius:10px;padding:10px;font-size:12px;color:#b8cdf0;margin-bottom:12px}
.warn{background:#2a1a05;border:1px solid #6b4512;color:#ffd9a0}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.kv div{background:var(--p2);border-radius:8px;padding:8px}.kv b{display:block;font-size:17px}
.sc{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;font-weight:900;font-size:16px;color:#000}
.hs{width:34px;height:34px;border-radius:50%;background:var(--p2);vertical-align:middle;object-fit:cover}.tl{width:18px;height:18px;vertical-align:middle;margin-right:3px}
.king{display:flex;gap:18px;align-items:center;background:linear-gradient(120deg,#2b1640,#131a2e 55%,#0e2a3a);border:1px solid #4a2f7a;border-radius:16px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.king img{width:110px;height:110px;border-radius:50%;border:3px solid var(--y);background:#0008;object-fit:cover}.king .crown{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--y)}
.king .big{font-size:44px;font-weight:900;line-height:1}.king .nm{font-size:24px;font-weight:800}
@media(max-width:640px){.king{flex-direction:column;text-align:center}.badge{display:none}.brand,.tag{display:none}main{padding:10px}th,td{padding:6px 5px}.hide-m{display:none}}
.gm{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.wx{display:flex;gap:10px;align-items:center}.wx .ic{font-size:30px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:12px}.tabs a{padding:7px 12px;border-radius:8px;background:var(--p);border:1px solid var(--b);color:var(--m);font-weight:600;white-space:nowrap}.tabs a.on{background:var(--o);color:#000}
.bar{height:6px;background:var(--p2);border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--o))}
details summary{cursor:pointer;color:var(--a)}
</style></head><body>
<header><div class="top"><button class="mb" onclick="document.body.classList.toggle('navopen')" aria-label="Menu">☰</button><div class="logo">MLB <span>Lab</span></div><div class="tag">Vision with Data</div><a class="brand" href="https://mkuritz.github.io/sports-labs/" title="Sports Labs">▲ Sports Labs</a><div class="badge" id="badge">Loading…</div></div></header>
<aside><nav id="nav"></nav></aside><div id="scrim" onclick="document.body.classList.remove('navopen')"></div><main id="app"><div class="card">Loading data…</div></main>
<script>
const $=s=>document.querySelector(s),D={};const J=u=>fetch(u+'?v='+Date.now()).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);return r.json()});
const V=[['today','⚾ Today'],['matchups','Matchups'],['pitchers','Pitchers'],['backtest','Backtest'],['method','Methodology']];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(x,d=1)=>x==null?'–':(x*100).toFixed(d)+'%';const f=(x,d=2)=>x==null?'–':(+x).toFixed(d);
const hs=id=>`<img class="hs" loading="lazy" alt="" src="https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:67:current.png/w_120,q_auto:best/v1/people/${id}/headshot/67/current">`;
const tlogo=id=>id?`<img class="tl" alt="" src="https://www.mlbstatic.com/team-logos/${id}.svg">`:'';
const scol=s=>s>=90?'#ff9f43':s>=75?'#ffc857':s>=50?'#4fc3ff':'#8d97b8';
const am=p=>p==null?'–':p>=.5?'-'+Math.round(p/(1-p)*100):'+'+Math.round((1-p)/p*100);
const tET=t=>new Date(t).toLocaleString('en-US',{timeZone:'America/New_York',weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' ET';
const dLong=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
function wxIcon(e){if(e.closed)return'🏟️';const c=e.code;if(c==null)return'🌤️';if(c>=95)return'⛈️';if(c>=61)return'🌧️';if(c>=51)return'🌦️';if(c>=45)return'🌫️';if(c>=3)return'☁️';if(c>=1)return'⛅';return'☀️'}
function park(e,sz=120){ // field diagram, CF at top; wind arrow relative to park orientation
 let arrow='';if(!e.closed&&e.wmph!=null&&e.wdir!=null&&e.az!=null){const toward=(e.wdir+180)%360;const rel=toward-e.az;const len=Math.min(44,10+e.wmph*2.2);
  const col=e.wout>2?'#3ddc97':e.wout<-2?'#ff6b7a':'#ffc857';
  arrow=`<g transform="translate(60,72) rotate(${rel})"><line x1="0" y1="${len/2}" x2="0" y2="${-len/2}" stroke="${col}" stroke-width="4" stroke-linecap="round"/><path d="M-8,${-len/2+8} L0,${-len/2-4} L8,${-len/2+8} Z" fill="${col}"/></g>`}
 return `<svg width="${sz}" height="${sz}" viewBox="0 0 120 120" aria-label="park and wind"><path d="M60,110 L10,58 Q60,0 110,58 Z" fill="#163a26" stroke="#2f6b45"/><path d="M60,110 L38,86 L60,64 L82,86 Z" fill="#6b4a2b" opacity=".75"/><circle cx="60" cy="110" r="3" fill="#fff"/><text x="60" y="18" fill="#8d97b8" font-size="9" text-anchor="middle">CF</text>${arrow}${e.closed?'<text x="60" y="66" fill="#e6ebff" font-size="10" text-anchor="middle">Roof closed</text>':''}</svg>`}
function windTxt(e){if(e.closed)return'Roof closed → no wind effect';if(e.wmph==null)return'Wind n/a';const d=e.wout>2?'<b class="g">blowing out</b>':e.wout<-2?'<b class="r">blowing in</b>':'cross-wind';return `${e.wmph} mph, ${d} (${f(e.wout,1)} mph out-component)`}
function buildNav(){$('#nav').innerHTML='<div class="sec">MLB Lab</div>'+V.map(([k,l])=>`<a href="#${k}" data-v="${k}">${l}</a>`).join('')+'<div class="sec">Exports</div><a href="data/hr_scores.json" target="_blank">hr_scores.json</a><a href="data/k_projections.json" target="_blank">k_projections.json</a><div class="sec">Sports Labs</div><a href="https://mkuritz.github.io/bet-lab/">Bet Lab</a><a href="https://mkuritz.github.io/nhl-lab/">NHL Lab</a><a href="https://mkuritz.github.io/sports-labs/">All products</a>'}
function sortable(root){root.querySelectorAll('table.s').forEach(t=>t.querySelectorAll('th').forEach((th,i)=>th.onclick=()=>{const tb=t.tBodies[0],rows=[...tb.rows],dir=th.dataset.d=th.dataset.d==='1'?'-1':'1';rows.sort((a,b)=>{const x=a.cells[i].dataset.v??a.cells[i].innerText,y=b.cells[i].dataset.v??b.cells[i].innerText,nx=parseFloat(x),ny=parseFloat(y);return(isNaN(nx)||isNaN(ny)?x.localeCompare(y):nx-ny)*dir});rows.forEach(r=>tb.appendChild(r))}))}
function banner(){const m=D.meta;const cls=m.slate_mode==='today'?'note':'note warn';return `<div class="${cls}"><b>${m.slate_mode==='today'?'Today':m.slate_mode==='next'?'Next slate':'Latest completed slate'}: ${dLong(m.slate_date)}</b> · ${esc(m.note)}. Postseason: lineups marked <span class="pill est">projected</span> are estimates (last game's starting nine) until MLB posts the official card.</div>`}
const G=pk=>D.slate.games.find(g=>g.pk===pk);
function kingCard(k){if(!k)return'<div class="card m">No probable starters announced for this slate yet.</div>';const g=G(k.pk);const mk=k.market;
 return `<div class="king">${hs(k.id)}<div style="flex:1"><div class="crown">👑 STRIKEOUT KING OF THE DAY</div><div class="nm">${esc(k.name)}</div><div class="m">${esc(k.team)} vs ${esc(k.opp)} · ${g?tET(g.start):''} · throws ${k.throws}</div>
 <div style="display:flex;gap:22px;margin-top:10px;flex-wrap:wrap;justify-content:inherit"><div><div class="big">${f(k.proj_k,1)}</div><div class="small m">projected Ks (estimate)</div></div><div><div class="big y">${pct(k.p10)}</div><div class="small m">P(10+ K)</div></div><div><div class="big">${f(k.exp_ip,1)}</div><div class="small m">expected IP</div></div>
 <div><div class="big" style="font-size:28px">${k.line!=null?'o'+k.line:'no line'}</div><div class="small m">${mk?esc(mk.src)+' line'+(mk.implied_over!=null?' · mkt '+pct(mk.implied_over,0)+' over':''):'no market line'}${k.p_over!=null?' · ours '+pct(k.p_over,0):''}</div></div>${k.result_k!=null?`<div><div class="big g">${k.result_k}</div><div class="small m">actual Ks</div></div>`:''}</div>
 <div class="small m" style="margin-top:8px">K% ${pct(k.feats.k_rate)} · CSW ${pct(k.feats.csw)} · whiff ${pct(k.feats.whiff)} · opp K% vs ${k.throws}HP ×${f(k.feats.opp_k)} · ump ×${f(k.feats.ump_k)} · ${k.fatigue.rest} days rest · last outing ${k.fatigue.last_np} pitches</div></div></div>`}
function today(){const H=D.hr.players,K=D.k.pitchers;let h=banner()+kingCard(D.k.king);
 h+=`<div class="grid">${D.slate.games.map(g=>{const e=g.env;return `<div class="card"><div class="gm"><div style="flex:1"><b>${tlogo(g.awayId)}${g.away} @ ${tlogo(g.homeId)}${g.home}</b><div class="small m">${tET(g.start)} · ${esc(g.venue)}</div><div class="small m">${esc(g.series||'')} ${g.seriesGame?'· Game '+g.seriesGame:''} · ${esc(g.status)}${g.status==='Final'?' '+g.score[0]+'-'+g.score[1]:''}</div>
 <div class="wx" style="margin-top:8px"><span class="ic">${wxIcon(e)}</span><div class="small">${e.closed?'Indoors 72°F (assumed)':e.temp_out!=null?e.temp_out+'°F':'–'} · ${e.hum!=null&&!e.closed?e.hum+'% humidity':''}<br>${windTxt(e)}<br><span class="m">${esc(e.roof_note)}${e.wsrc?' · '+esc(e.wsrc):''}</span></div></div>
 <div class="small m" style="margin-top:6px">SP: ${esc(nm(g.sp.away))} vs ${esc(nm(g.sp.home))}</div></div>${park(e)}</div></div>`}).join('')}</div>`;
 h+=`<div class="card"><h3>🏠💣 Home Run Board <span class="m small">ranked by HR Score · ${H.length} batters</span></h3><div class="small m" style="margin-bottom:8px">HR Score = percentile (1–99) of our estimated P(1+ HR) among every 2026 batter-game. % is a model estimate, not a guarantee. Market = DraftKings when Bet Lab's budgeted pull has it, else Kalshi mid-price, else "no line". Edge = our % − market implied % (market includes vig).</div>
 <div class="filters" style="margin-bottom:8px"><input id="q" placeholder="Search batter or team" oninput="filt()" style="width:220px"></div>
 <div class="tw"><table class="s" id="hrt"><thead><tr><th>Batter</th><th>Score</th><th>Our %</th><th>Market</th><th>Edge</th><th class="hide-m">Spot</th><th class="hide-m">vs SP</th><th class="hide-m">Barrel%</th><th class="hide-m">30d trend</th><th class="hide-m">BvP</th><th class="hide-m">Park</th><th class="hide-m">Wx</th>${H.some(p=>p.result)?'<th>Result</th>':''}</tr></thead><tbody>${H.map(p=>{const g=G(p.pk);const mk=p.market;return `<tr data-s="${esc((p.name+' '+p.team).toLowerCase())}"><td class="l">${hs(p.id)} <a href="#matchups/${p.pk}">${esc(p.name)}</a> <span class="m small">${p.team} ${p.home?'vs':'@'} ${p.opp}</span> ${p.lineup==='projected'?'<span class="pill est">proj</span>':'<span class="pill ok">conf</span>'}</td>
 <td data-v="${p.score}"><span class="sc" style="background:${scol(p.score)}">${p.score}</span></td><td data-v="${p.p_hr}"><b>${pct(p.p_hr)}</b></td><td data-v="${mk?mk.implied:-1}">${mk?(mk.src==='DraftKings'?'DK '+(mk.odds>0?'+':'')+mk.odds:'Kalshi '+pct(mk.implied,0))+'<div class="small m">'+pct(mk.implied,1)+' implied</div>':'<span class="m">no line</span>'}</td>
 <td data-v="${p.edge??-9}" class="${p.edge>0.02?'g':p.edge<-0.02?'r':''}">${p.edge==null?'–':(p.edge>0?'+':'')+(p.edge*100).toFixed(1)+' pts'}</td><td class="hide-m">${p.spot}</td><td class="hide-m l small">${esc(p.pitcher.name||'TBD')} (${p.pitcher.throws})</td><td class="hide-m">${pct(p.feats.barrel)}</td><td class="hide-m">×${f(p.feats.t30)}</td>
 <td class="hide-m small">${p.bvp.pa?p.bvp.hr+' HR / '+p.bvp.pa+' PA':'<span class="m">none</span>'}</td><td class="hide-m">${f(p.feats.pf)}</td><td class="hide-m">${g?wxIcon(g.env):''} ${p.feats.closed?'':p.feats.temp+'°'}</td>${H.some(q=>q.result)?`<td>${p.result?(p.result.hr?'<b class="g">'+p.result.hr+' HR</b>':'<span class="m">0</span>'):'–'}</td>`:''}</tr>`}).join('')}</tbody></table></div></div>`;
 h+=`<div class="card"><h3>Strikeout board</h3><div class="tw"><table class="s"><thead><tr><th>Starter</th><th>Proj K</th><th>Exp IP</th><th>P(10+)</th><th>Line</th><th>Our P(over)</th><th>Market P(over)</th><th>Edge</th><th class="hide-m">Workload</th><th class="hide-m">Rest</th></tr></thead><tbody>${K.map(k=>`<tr><td class="l">${hs(k.id)} <a href="#pitchers/${k.id}">${esc(k.name)}</a> <span class="m small">${k.team} vs ${k.opp}</span></td><td><b>${f(k.proj_k,1)}</b></td><td>${f(k.exp_ip,1)}</td><td>${pct(k.p10)}</td><td>${k.line??'<span class="m">no line</span>'}${k.market?'<div class="small m">'+k.market.src+'</div>':''}</td><td>${pct(k.p_over,0)}</td><td>${k.market&&k.market.implied_over!=null?pct(k.market.implied_over,0):'–'}</td><td class="${k.edge>0.03?'g':k.edge<-0.03?'r':''}">${k.edge==null?'–':(k.edge>0?'+':'')+(k.edge*100).toFixed(0)+' pts'}</td><td class="hide-m">${k.fatigue.career_hi?f(k.fatigue.workload)+'× career high':'–'}</td><td class="hide-m">${k.fatigue.rest}d</td></tr>`).join('')}</tbody></table></div></div>`;
 return h}
window.filt=()=>{const q=$('#q').value.toLowerCase();document.querySelectorAll('#hrt tbody tr').forEach(r=>r.style.display=r.dataset.s.includes(q)?'':'none')};
const nm=id=>{if(!id)return'TBD';const k=D.k.pitchers.find(x=>x.id===id);return k?k.name:'#'+id};
function matchups(pk){const gs=D.slate.games;pk=+pk||gs[0]?.pk;const g=G(pk);if(!g)return banner()+'<div class="card">No games.</div>';
 let h=banner()+`<div class="tabs">${gs.map(x=>`<a href="#matchups/${x.pk}" class="${x.pk===pk?'on':''}">${x.away} @ ${x.home}</a>`).join('')}</div>`;
 for(const side of ['away','home']){const team=g[side],sp=g.sp[side==='away'?'home':'away'];const rows=D.hr.players.filter(p=>p.pk===pk&&p.team===team).sort((a,b)=>a.spot-b.spot);
  h+=`<div class="card"><h3>${tlogo(g[side+'Id'])}${team} lineup vs ${esc(nm(sp))} <span class="pill ${g.lineup_status[side]==='confirmed'?'ok':'est'}">${g.lineup_status[side]}</span></h3><div class="tw"><table class="s"><thead><tr><th>#</th><th class="l">Batter</th><th>Bats</th><th>BvP PA</th><th>BvP HR</th><th>BvP xwOBA</th><th>BvP adj.</th><th>Split vs hand</th><th>HR/PA (shrunk)</th><th>EV</th><th>xISO</th><th>7/14/30d HR trend</th><th>Score</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${p.spot}</td><td class="l">${esc(p.name)}</td><td>${p.bats}</td><td>${p.bvp.pa}</td><td>${p.bvp.hr}</td><td>${p.bvp.pa?f(p.bvp.xwoba,3):'–'}</td><td class="${p.bvp.adj>0.05?'g':p.bvp.adj<-0.05?'r':''}">${p.bvp.adj>0?'+':''}${f(p.bvp.adj*100,1)}%</td><td>${p.feats.split>0?'+':''}${f(p.feats.split*100,1)}%</td><td>${pct(p.feats.hr_rate,2)}</td><td>${f(p.feats.ev,1)}</td><td>${f(p.feats.xiso,3)}</td><td>×${f(p.feats.t7)} / ×${f(p.feats.t14)} / ×${f(p.feats.t30)}</td><td><span class="sc" style="background:${scol(p.score)};width:30px;height:30px;font-size:13px">${p.score}</span></td></tr>
  <tr><td></td><td colspan="12" class="l small m" style="white-space:normal">Top drivers: ${p.drivers.map(d=>`<span class="${d.v>0?'g':'r'}">${esc(d.f)} ${d.v>0?'▲':'▼'}</span>`).join(' · ')}</td></tr>`).join('')}</tbody></table></div>
  <div class="small m">BvP = every plate appearance vs today's listed starter in 2024–26 Statcast. Small samples are shrunk hard toward the batter's own rate (60-PA prior), so "BvP adj." is the effect actually used. In the 2026 backtest BvP added almost nothing beyond the other features.</div></div>`}
 return h}
function spark(vals,w=160,hgt=36,col='#4fc3ff'){const v=vals.filter(x=>x!=null);if(v.length<2)return'';const mn=Math.min(...v),mx=Math.max(...v),rg=mx-mn||1;return `<svg width="${w}" height="${hgt}"><polyline fill="none" stroke="${col}" stroke-width="2" points="${vals.map((x,i)=>x==null?'':`${i/(vals.length-1)*w},${hgt-3-(x-mn)/rg*(hgt-6)}`).join(' ')}"/></svg>`}
function line2(series,opt){ // series:[{name,col,pts:[[x,y]]}]
 const W=opt.w||560,H=opt.h||220,P=36;const xs=series.flatMap(s=>s.pts.map(p=>p[0])),ys=series.flatMap(s=>s.pts.map(p=>p[1])).filter(y=>y!=null);
 const x0=opt.x0??Math.min(...xs),x1=opt.x1??Math.max(...xs),y0=opt.y0??Math.min(...ys),y1=opt.y1??Math.max(...ys);const X=x=>P+(x-x0)/(x1-x0||1)*(W-P-10),Y=y=>H-24-(y-y0)/(y1-y0||1)*(H-34);
 let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px"><rect x="${P}" y="10" width="${W-P-10}" height="${H-34}" fill="#0d1326"/>`;
 for(let i=0;i<=4;i++){const yv=y0+(y1-y0)*i/4;s+=`<text x="${P-4}" y="${Y(yv)+3}" fill="#8d97b8" font-size="10" text-anchor="end">${opt.fy?opt.fy(yv):yv.toFixed(2)}</text><line x1="${P}" x2="${W-10}" y1="${Y(yv)}" y2="${Y(yv)}" stroke="#26304f"/>`}
 (opt.xl||[]).forEach(([xv,l])=>s+=`<text x="${X(xv)}" y="${H-8}" fill="#8d97b8" font-size="10" text-anchor="middle">${l}</text>`);
 if(opt.diag)s+=`<line x1="${X(x0)}" y1="${Y(x0)}" x2="${X(Math.min(x1,y1))}" y2="${Y(Math.min(x1,y1))}" stroke="#8d97b8" stroke-dasharray="4 4"/>`;
 series.forEach(se=>{s+=`<polyline fill="none" stroke="${se.col}" stroke-width="2.5" points="${se.pts.filter(p=>p[1]!=null).map(p=>X(p[0])+','+Y(p[1])).join(' ')}"/>`+se.pts.filter(p=>p[1]!=null).map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3.5" fill="${se.col}"><title>${se.name}: ${p[1]}</title></circle>`).join('')});
 s+='</svg><div class="small">'+series.map(se=>`<span style="color:${se.col}">● ${se.name}</span>`).join(' &nbsp; ')+'</div>';return s}
function pitchers(id){const P=D.pit.pitchers,FC=D.fat;let h=`<div class="note">${esc(D.pit.note)} Career high = prior-season MLB regular-season innings only (minors/NPB/KBO not counted), so it overstates workload for pitchers new to MLB. All velocities are Statcast four-seam + sinker averages.</div>`;
 const K=D.k.pitchers;if(K.length)h+=`<div class="grid">${K.map(k=>`<div class="card"><div style="display:flex;gap:10px;align-items:center">${hs(k.id)}<div><b>${esc(k.name)}</b><div class="small m">${k.team} vs ${k.opp} · ${dLong(D.k.date)}</div></div></div><div class="kv" style="margin-top:10px"><div>Days rest<b>${k.fatigue.rest}</b></div><div>Last outing<b>${k.fatigue.last_np} p / ${f(k.fatigue.last_ip,1)} IP</b></div><div>2026 IP<b>${f(k.fatigue.cum_ip,1)}</b></div><div>Prior career high<b>${k.fatigue.career_hi??'–'}</b></div><div>Workload<b class="${k.fatigue.workload>1.2?'r':k.fatigue.workload>1?'y':''}">${f(k.fatigue.workload)}×</b></div><div>Velo Δ (last 3)<b class="${k.fatigue.velo_d3<-0.5?'r':k.fatigue.velo_d3>0.3?'g':''}">${k.fatigue.velo_d3>0?'+':''}${f(k.fatigue.velo_d3,1)} mph</b></div><div>Spin Δ<b>${k.fatigue.spin_d>0?'+':''}${k.fatigue.spin_d??'–'} rpm</b></div></div><div class="small m" style="margin-top:8px">Last starts: ${k.last_starts.map(s=>`${s.d.slice(5)} ${s.ip}IP ${s.np}p ${s.K}K ${s.fbv??''}`).join(' · ')}</div></div>`).join('')}</div>`;
 h+=`<div class="card"><h3>Postseason starter workload</h3><div class="tw"><table class="s"><thead><tr><th>Pitcher</th><th>2026 IP</th><th>Prior high</th><th>Ratio</th><th>Last start</th><th>Days since</th><th>Last pitches</th><th>FB velo H1→L6</th><th>K% H1→L6</th><th>CSW H1→L6</th><th class="hide-m">Last 12 starts velo</th></tr></thead><tbody>${P.map(p=>`<tr><td class="l">${esc(p.name)}</td><td>${p.ip}</td><td>${p.career_hi??'–'}</td><td class="${p.ratio>1.2?'r':p.ratio>1?'y':''}">${p.ratio??'–'}</td><td>${p.last.slice(5)}</td><td>${p.rest}</td><td>${p.last_np}</td><td>${f(p.fbv_h1,1)} → <b class="${p.fbv_l6-p.fbv_h1<-0.5?'r':p.fbv_l6-p.fbv_h1>0.3?'g':''}">${f(p.fbv_l6,1)}</b></td><td>${pct(p.k_h1)} → <b>${pct(p.k_l6)}</b></td><td>${pct(p.csw_h1)} → <b>${pct(p.csw_l6)}</b></td><td class="hide-m">${spark(p.starts.map(s=>s.fbv))}</td></tr>`).join('')}</tbody></table></div><div class="small m">H1 = regular-season starts before July 1; L6 = last six regular-season starts.</div></div>`;
 h+=`<div class="card"><h3>Fatigue case study: Sánchez vs Misiorowski vs Schlittler (2026, real Statcast)</h3><div class="g2">`;
 const cols={'Cristopher Sánchez':'#ff6b7a','Jacob Misiorowski':'#4fc3ff','Cam Schlittler':'#3ddc97'};
 const mos=['2026-04','2026-05','2026-06','2026-07','2026-08','2026-09'];const mx=mos.map((m,i)=>[i,m.slice(5)==='04'?'Apr':m.slice(5)==='05'?'May':m.slice(5)==='06'?'Jun':m.slice(5)==='07'?'Jul':m.slice(5)==='08'?'Aug':'Sep']);
 const ser=k=>Object.entries(FC).map(([n,v])=>({name:n,col:cols[n],pts:mos.map((m,i)=>{const r=v.monthly.find(x=>x.m===m);return[i,r?+r[k]:null]})}));
 h+=`<div><b class="small">Fastball velocity by month (mph)</b>${line2(ser('fbv'),{xl:mx,fy:y=>y.toFixed(1)})}</div><div><b class="small">K% by month</b>${line2(ser('k_pct'),{xl:mx,fy:y=>(y*100).toFixed(0)+'%'})}</div><div><b class="small">CSW% by month</b>${line2(ser('csw'),{xl:mx,fy:y=>(y*100).toFixed(0)+'%'})}</div><div><b class="small">Innings per start by month</b>${line2(ser('ip_per'),{xl:mx,fy:y=>y.toFixed(1)})}</div></div>`;
 h+=`<div class="tw"><table><thead><tr><th>Pitcher</th><th>Prior career high IP</th><th>2026 reg IP</th><th>Passed prior high</th><th>FB velo H1 → L6</th><th>K% H1 → L6</th><th>CSW H1 → L6</th><th>IP/start H1 → L6</th><th>HR/BF H1 → L6</th><th>Ks vs model, L6</th></tr></thead><tbody>${Object.entries(FC).map(([n,v])=>`<tr><td class="l" style="color:${cols[n]}">${n}</td><td>${v.prior_career_high_ip}</td><td>${v.reg_season_ip}</td><td>${v.passed_prior_high_on||'–'}</td><td>${v.first_half.fbv} → ${v.last6_reg.fbv}</td><td>${pct(v.first_half.k_pct)} → ${pct(v.last6_reg.k_pct)}</td><td>${pct(v.first_half.csw)} → ${pct(v.last6_reg.csw)}</td><td>${v.first_half.ip_per} → ${v.last6_reg.ip_per}</td><td>${pct(v.first_half.hr_per_bf)} → ${pct(v.last6_reg.hr_per_bf)}</td><td>${v.last6_reg.K_vs_proj>0?'+':''}${v.last6_reg.K_vs_proj}</td></tr>`).join('')}</tbody></table></div>
 <div class="note" style="margin-top:10px">${D.fatnote}</div></div>`;return h}
function calChart(cal,title,col){const mx=Math.max(...cal.map(c=>Math.max(c.pred,c.obs)))*1.08;return `<div><b class="small">${title}</b>${line2([{name:'Observed rate',col,pts:cal.map(c=>[c.pred,c.obs])}],{x0:0,x1:mx,y0:0,y1:mx,diag:1,xl:[0,.25,.5,.75,1].map(t=>[t*mx,(t*mx*100).toFixed(0)+'%']),fy:y=>(y*100).toFixed(0)+'%'})}<div class="small m">x = predicted, y = observed, dashed = perfect calibration. Each dot is one bin.</div></div>`}
function backtest(){const B=D.bth,K=D.btk,w=B.walkforward_2026,c=B.chosen;let h=`<div class="note">Walk-forward: every week of the 2026 regular season was predicted by a model refit only on games before that week (2025 season + 2026 to date). Every feature uses only data from earlier dates. Postseason games are excluded from the scored backtest.</div>`;
 h+=`<div class="card"><h3>🏠 Home Run Score — 2026 regular season (${w[c].n.toLocaleString()} starter batter-games)</h3><div class="kv"><div>Brier (ours)<b>${w[c].brier}</b></div><div>Brier (league rate)<b>${w.base.brier}</b></div><div>Brier skill<b class="g">+${(B.brier_skill_vs_league*100).toFixed(1)}%</b></div><div>Log loss (ours)<b>${w[c].logloss}</b></div><div>Log loss (league)<b>${w.base.logloss}</b></div><div>Top-decile HR rate<b>${pct(B.top_decile_hit)}</b></div><div>Bottom-decile<b>${pct(B.bottom_decile_hit)}</b></div><div>Top-decile lift<b>${B.lift_top_decile}×</b></div><div>Avg predicted / actual<b>${pct(w[c].mean_pred)} / ${pct(w[c].obs)}</b></div></div>
 <div class="g2" style="margin-top:12px">${calChart(B.calibration,'HR Score calibration (deciles)','#ff9f43')}${B.market?calChart(B.market.calib_kalshi,'Kalshi market calibration (same games)','#b28dff'):''}</div>
 ${B.market?`<h3 style="margin-top:14px">vs the market (Kalshi pre-game prices)</h3><div class="kv"><div>Matched batter-games<b>${B.market.n.toLocaleString()}</b></div><div>Brier ours<b>${B.market.ours.brier}</b></div><div>Brier Kalshi<b>${B.market.kalshi.brier}</b></div><div>Brier 50/50 blend<b>${B.market.blend.brier}</b></div><div>Log loss ours<b>${B.market.ours.logloss}</b></div><div>Log loss Kalshi<b>${B.market.kalshi.logloss}</b></div><div>"Edge ≥3 pts" plays<b>${B.market.edge_bets.n}</b></div><div>Their hit rate / avg price<b>${pct(B.market.edge_bets.hit)} / ${pct(B.market.edge_bets.avg_price)}</b></div><div>Flat $1 ROI (before fees)<b class="${B.market.edge_bets.roi_per_1>0?'g':'r'}">${(B.market.edge_bets.roi_per_1*100).toFixed(1)}%</b></div></div><div class="small m">${esc(B.market.games_note)}. DraftKings historical prices are not available for free, so the market comparison uses Kalshi.</div>`:'<div class="small m">No market prices matched.</div>'}
 <h3 style="margin-top:14px">By month</h3><div class="tw"><table><thead><tr><th>Month</th><th>n</th><th>Brier ours</th><th>Brier league</th><th>Pred</th><th>Actual</th></tr></thead><tbody>${B.monthly.map(m=>`<tr><td>${m.m}</td><td>${m.n}</td><td>${m.brier}</td><td>${m.base_brier}</td><td>${pct(m.mean_pred)}</td><td>${pct(m.obs)}</td></tr>`).join('')}</tbody></table></div>
 <details style="margin-top:10px"><summary>Model selection & feature weights</summary><div class="small m">Logistic vs gradient boosting was chosen on 2025 only (train Apr–Jun, test Jul–Sep): ${Object.entries(B.selection_2025H2).map(([k,v])=>k+' log loss '+v.logloss).join(', ')}. 2026 walk-forward: logistic ${w.logit.logloss}, GBM ${w.gbm.logloss}. Standardized logistic weights (bigger = more HR):</div><div class="kv" style="margin-top:6px">${Object.entries(B.logit_coefs).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).map(([k,v])=>`<div class="small">${k}<b class="${v>0?'g':'r'}">${v>0?'+':''}${v}</b></div>`).join('')}</div></details></div>`;
 const kw=K.walkforward_2026;h+=`<div class="card"><h3>👑 Strikeout projections — 2026 regular season (${kw.model.n.toLocaleString()} starts)</h3><div class="kv"><div>MAE ours<b>${kw.model.mae}</b></div><div>MAE baseline<b>${kw.baseline.mae}</b></div><div>RMSE ours / base<b>${kw.model.rmse} / ${kw.baseline.rmse}</b></div><div>Neg. log-lik ours / base<b>${kw.model.nll} / ${kw.baseline.nll}</b></div><div>Avg proj / actual K<b>${kw.model.mean_pred} / ${kw.model.obs}</b></div><div>P(10+) avg pred / actual<b>${pct(K.p10.mean_pred)} / ${pct(K.p10.obs)}</b></div><div>10+ K games<b>${K.p10.n10}</b></div><div>Hit rate, top-50 P(10+)<b>${pct(K.p10.top50_hit)}</b></div></div>
 <div class="small m">Baseline = each pitcher's average Ks per start this season, shrunk toward league average. The model runs about 0.14 K high on average (the 2025 training season struck out more), and P(10+) runs a little high too. Keep that in mind on overs.</div>
 <div class="g2" style="margin-top:12px">${calChart(K.calibration_ge['6'],'P(6+ K) calibration','#4fc3ff')}${calChart(K.calibration_ge['10'],'P(10+ K) calibration','#ffc857')}</div>
 <h3 style="margin-top:12px">Fatigue signal check</h3><div class="small m">Average (actual − projected) Ks by workload ratio (2026 IP so far ÷ prior-season career high):</div><div class="tw"><table><thead><tr><th>Workload bucket</th><th>Starts</th><th>Mean residual (K)</th><th>Velo Δ last 3</th></tr></thead><tbody>${K.resid_by_workload.map(b=>`<tr><td>${b.b}</td><td>${b.n}</td><td class="${b.mean_resid<-0.25?'r':''}">${b.mean_resid}</td><td>${b.velo_d3}</td></tr>`).join('')}</tbody></table></div></div>`;return h}
function method(){return `<div class="card"><h3>What MLB Lab is</h3><p>MLB Lab turns public Statcast pitch-by-pitch data into two proprietary numbers. The <b>Home Run Score</b> is our estimate that a batter hits at least one home run today. The <b>Strikeout King of the Day</b> is the starter with the highest projected strikeouts. Every number is a model <b>estimate</b>, it's free, and nothing on this page is betting advice.</p></div>
<div class="card"><h3>🏠 Home Run Score</h3><p>A logistic regression on one row per starting batter per game. We chose it over gradient boosting because it was better on a 2025-only holdout. The output is P(1+ HR). The 1–99 score is that probability's percentile among every 2026 batter-game.</p><ul class="small">
<li><b>Batter power:</b> HR/PA, barrel%, average exit velocity, contact-based xISO. Each is shrunk toward the batter's 2025 rate, then toward league average.</li>
<li><b>Trend:</b> 7/14/30-day HR rate vs his season rate, and the 14/30-day barrel% change.</li>
<li><b>Pitcher:</b> the starter's HR/BF and barrel% allowed, his fastball share (four-seam, sinker and cutter), his HR rate vs this batter's hand, and the opposing staff's HR rate.</li>
<li><b>Handedness split:</b> the batter's HR rate vs this pitcher's hand compared with his overall rate. Switch hitters bat opposite.</li>
<li><b>BvP:</b> every 2024–26 plate appearance against today's starter, computed by us from Statcast. We show PA, HR and xwOBA so you can see the sample, then shrink it with a 60-PA prior toward his own rate.</li>
<li><b>Park & weather:</b> park HR factor from 2024–25 Statcast (regressed), home/away, temperature, humidity, and the wind component blowing out to center. We use MLB's game-day wind report when it exists. Otherwise we take the Open-Meteo forecast and project it onto the park's home-to-center bearing (MLB venue azimuth). Domes and closed roofs zero out wind.</li>
<li><b>Lineup:</b> lineup spot and expected PAs. Before MLB posts the card, we project the lineup from the team's last game.</li></ul>
<p class="small m"><b>The game total (O/U) is not in the model.</b> No free historical totals exist for a leak-free backtest. When Bet Lab has a total, it's shown for context only.</p></div>
<div class="card"><h3>👑 Strikeout model</h3><p>A Poisson GLM for strikeouts, with a negative-binomial spread for the ladder, P(10+) and P(over the line). Features: shrunk K%, CSW%, whiff%, last-3-start form, the opponent's K% vs that hand, the home-plate umpire's K rate (MLB officials data, shrunk), park K factor, and expected batters faced from his recent starts.</p>
<p><b>Fatigue & workload:</b> days of rest, last outing's pitch count and innings, innings this year vs his prior-season MLB career high, last-start and 3-start fastball velocity vs his season average, and four-seam spin change.</p></div>
<div class="card"><h3>Data sources ($0/month)</h3><ul class="small"><li>MLB Stats API (schedule, probable pitchers, lineups, umpires, venues, game-day weather, career innings)</li><li>Baseball Savant / Statcast via pybaseball (pitch-level data, 2024–2026)</li><li>Open-Meteo (forecast and historical weather)</li><li>Kalshi public market data (no key)</li><li>DraftKings batter_home_runs and pitcher_strikeouts via The Odds API, pulled by Bet Lab under a strict credit guard: at most one pull per day, MLB capped at 24 credits a month, and only when Arb Lab's budget projects ≥100 credits left. Otherwise we show Kalshi or "no line".</li></ul><p class="small m">We do not scrape RotoWire, RotoWorld, FanGraphs or any sportsbook site. Data refreshes daily via GitHub Actions, with extra runs before first pitch.</p></div>
<div class="card small m">21+. Please bet responsibly. Estimates can be wrong; past backtest performance does not guarantee future results. MLB Lab is not affiliated with MLB, DraftKings or Kalshi. Problem gambling help: 1-800-GAMBLER.</div>`}
