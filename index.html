 const G=B.games||[];

function hotdCard(x){if(!x)return'';const p=x.p;return `<div class="king" style="background:linear-gradient(120deg,#0f3326,#131a2e 55%,#2b1640);border-color:#1d6b4c">${hs(x.id)}<div style="flex:1"><div class="crown" style="color:var(--g)">⭐ HITTER OF THE DAY</div><div class="nm">${esc(x.name)}</div><div class="m">${esc(x.team)} vs ${esc(x.opp)} · bats ${ord(x.spot)} · ${tET(x.start)} · ${rs(x.status)}</div>
 <div class="big3"><div><b>${pct(p.hit,0)}</b><span class="small m">1+ hit</span></div><div><b class="y">${pct(p.hrr,0)}</b><span class="small m">H+R+RBI 2+</span></div><div><b>${pct(p.rbi,0)}</b><span class="small m">1+ RBI</span></div><div><b>${p.hr==null?'–':pct(p.hr,0)}</b><span class="small m">home run</span></div></div>
 <div style="margin-top:8px">Best prop to play: <b class="g">${esc(x.best_label)}</b>${x.box?` · final: ${x.box.h} H, ${x.box.r} R, ${x.box.rbi} RBI${x.box.hr?', '+x.box.hr+' HR':''}`:''}</div><div class="small m" style="margin-top:4px">Why: ${x.why.map(esc).join(' · ')}</div></div></div>`}
function parlayCard(x,ag){if(!x)return'';return `<div class="pz ${ag?'ag':''}"><div class="hd"><span class="tg ${ag?'ag':'safe'}">${ag?'AGGRESSIVE · UPSIDE':'SAFER · LOW HURDLE'}</span><h3 style="margin:0">${ag?'RBI Parlay':'H+R+RBI Parlay'}</h3><span class="m small">${x.legs.length} legs · each ${esc(x.market)} (${esc(x.line)})</span><span style="margin-left:auto">${rs(x.status)}</span></div>
 ${x.legs.map(l=>`<div class="leg">${hs(l.id)}<div><b>${esc(l.name)}</b> <span class="m small">${esc(l.team)} vs ${esc(l.opp)} · bats ${ord(l.spot)}</span><div class="small m">${l.why.map(esc).join(' · ')}</div>${window.LR?LR.tag('mlb',l.id,ag?'RBIs':'Hits + Runs + RBIs',parseFloat(String(x.line).replace(/[^0-9.]/g,''))||(ag?0.5:1.5),l.name):''}${l.box?`<div class="small">Final: ${l.box.h} H, ${l.box.r} R, ${l.box.rbi} RBI ${rs(l.result)}</div>`:l.result==='void'?'<div class="small m">Did not play: leg voided</div>':''}</div><div class="pp">${pct(l.p,0)}<div class="small m" style="font-weight:400">our chance</div></div></div>`).join('')}
 <div class="big3"><div><b class="y">${pct(x.p,1)}</b><span class="small m">chance all legs hit</span></div><div><b>${sg(x.fair)}</b><span class="small m">fair odds</span></div><div><b class="g">${sg(x.take_at)}</b><span class="small m">take it at this or longer</span></div><div><b>${x.book?esc(x.book):'–'}</b><span class="small m">best book price${x.book?'':' (not pulled)'}</span></div></div>
 <div class="small m" style="margin-top:8px">Snapshot ${tET(x.snapshot)} · locks at first pitch ${tET(x.lock)}. The combined chance accounts for teammates' results moving together. Estimates, not guarantees.</div></div>`}
function recLine(r,lab){return `<div><b>${r.parlays.w}–${r.parlays.l}</b><span class="small m">${lab} parlays</span></div><div><b>${r.legs.w}–${r.legs.l}</b><span class="small m">${lab} legs</span></div>`}
function parlays(){const H=D.hrr;if(!H)return'<div class="card m">Hitter parlays are loading for the first time.</div>';const R=H.record,B=H.backtest||{};let h=`<h2>🎯 Hitter Parlays & Hitter of the Day</h2>`+phaseBar();
 h+=`<div class="card"><h3>Running record <span class="small m">graded nightly from official box scores · started Oct 15, 2026</span></h3><div class="big3">${recLine(R.safe,'H+R+RBI')}${recLine(R.rbi,'RBI')}<div><b>${R.hotd.w}–${R.hotd.l}</b><span class="small m">Hitter of the Day</span></div></div></div>`;
 if(!H.safe&&!H.rbi&&!H.hotd&&IDLE())h+=`<div class="note">${D.ph&&D.ph.offseason?'<b>Offseason.</b> No new parlays until Opening Day. The full season record and history stay below.':'<b>No game today.</b> Parlays post again for the next game once both clubs are set and lineups are out.'}</div>`;
 else if(!H.safe&&!H.rbi&&!H.hotd)h+=`<div class="note warn"><b>Today's highlights aren't out yet.</b> We only use confirmed starting lineups, so highlights post once MLB releases them, usually 1 to 4 hours before first pitch, and refresh every 20 minutes until the first leg starts.${H.pending.length?'<br>Waiting on: '+H.pending.map(p=>esc(p.game)+' ('+tET(p.start)+')').join(', '):' No more games today. Off day or slate complete.'}</div>`;
 h+=hotdCard(H.hotd)+parlayCard(H.safe,0)+parlayCard(H.rbi,1);
 {const CI=(H.called_it||[]).filter(c=>c.date===YDAY);if(CI.length)h+=`<div class="card"><h3>✅ Called it</h3><div class="grid">${CI.map(c=>`<div class="card ci"><b>${esc(c.title)}</b> <span class="m small">${dLong(c.date)}</span>${c.fair?`<div class="small">Hit at fair ${sg(c.fair)}</div>`:''}${c.best?`<div class="small">${esc(c.best)}</div>`:''}<div class="small m">${c.legs.map(l=>esc(l.name)+(l.box?` (${l.box.h} H, ${l.box.r} R, ${l.box.rbi} RBI)`:'')).join(' · ')}</div></div>`).join('')}</div></div>`;}
 const T=B.targets||{};if(T.hrr2){const t=T.hrr2,r2=T.rbi1,P=B.parlays;h+=`<div class="card"><h3>How good is this, really? <span class="small m">${B.n?.toLocaleString()} starting-batter games, ${B.span?.[0]} to ${B.span?.[1]}, each predicted using only data from before that game</span></h3>
 <div class="small" style="margin-bottom:8px">The average starting hitter gets <b>2+ H+R+RBI ${pct(t.base,0)}</b> of the time and <b>1+ RBI ${pct(r2.base,0)}</b> of the time (1+ H+R+RBI: ${pct(B.hrr1_base,0)}). Our top 5 highlights each day hit 2+ H+R+RBI <b>${pct(t.daily_top5.hit,1)}</b> of the time and 1+ RBI <b>${pct(r2.daily_top5.hit,1)}</b>. That's a real but modest edge over average, so we keep parlays short.</div>
 <div class="tw"><table><thead><tr><th>Our ranking (10 = best)</th>${t.deciles.map(d=>`<th>${d.dec}</th>`).join('')}</tr></thead><tbody><tr><td class="l">H+R+RBI 2+ actual</td>${t.deciles.map(d=>`<td>${pct(d.hit,0)}</td>`).join('')}</tr><tr><td class="l m">we estimated</td>${t.deciles.map(d=>`<td class="m">${pct(d.pred,0)}</td>`).join('')}</tr><tr><td class="l">RBI 1+ actual</td>${r2.deciles.map(d=>`<td>${pct(d.hit,0)}</td>`).join('')}</tr><tr><td class="l m">we estimated</td>${r2.deciles.map(d=>`<td class="m">${pct(d.pred,0)}</td>`).join('')}</tr></tbody></table></div>
 <div class="small" style="margin-top:8px">Daily parlay test, best legs from different games: H+R+RBI 3 legs won <b>${P.hrr2_3.won} of ${P.hrr2_3.days}</b> days (${pct(P.hrr2_3.hit,0)}, we estimated ${pct(P.hrr2_3.pred,0)}), 4 legs ${P.hrr2_4.won} of ${P.hrr2_4.days}. RBI 2 legs won ${P.rbi1_2.won} of ${P.rbi1_2.days} (${pct(P.rbi1_2.hit,0)}), 3 legs ${P.rbi1_3.won} of ${P.rbi1_3.days}. Our top-ranked highlights ran a little hot, so live chances are recalibrated against these real results.</div></div>`}
 if(H.history.length>1)h+=`<div class="card"><h3>History</h3><div class="tw"><table><thead><tr><th>Date</th><th>H+R+RBI Parlay</th><th>RBI Parlay</th><th>Hitter of the Day</th></tr></thead><tbody>${H.history.map(d=>`<tr><td class="l">${d.date}</td><td>${d.safe?d.safe.legs.length+' legs '+sg(d.safe.fair)+' · '+rs(d.safe.status):'–'}</td><td>${d.rbi?d.rbi.legs.length+' legs '+sg(d.rbi.fair)+' · '+rs(d.rbi.status):'–'}</td><td>${d.hotd?esc(d.hotd.name)+' · '+rs(d.hotd.status):'–'}</td></tr>`).join('')}</tbody></table></div></div>`;
 return h}
